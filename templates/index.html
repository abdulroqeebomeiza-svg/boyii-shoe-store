<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BOYII SHOE STORE | Abuja</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50">
<header class="bg-black text-white p-4 sticky top-0">
<div class="max-w-6xl mx-auto flex justify-between items-center">
<h1 class="text-2xl font-bold">BOYII 👟</h1>
<a href="https://wa.me/2348100000000" class="bg-green-500 px-4 py-2 rounded-full text-sm">WhatsApp</a>
</div>
</header>

<div class="bg-black text-white text-center py-16 px-4">
<h2 class="text-4xl font-bold mb-4">Step Into Style</h2>
<p class="text-xl mb-6">Premium Shoes in Abuja - Nationwide Delivery</p>
<a href="#shop" class="bg-white text-black px-8 py-3 rounded-full font-bold">Shop Now</a>
</div>

<div id="shop" class="max-w-6xl mx-auto p-4 py-10">
<h3 class="text-3xl font-bold text-center mb-8">Our Collection</h3>
<div class="grid grid-cols-2 md:grid-cols-3 gap-4">
{% for shoe in shoes %}
<div class="bg-white rounded-2xl shadow-lg overflow-hidden">
<img src="{{ shoe.image }}" class="w-full h-48 object-cover">
<div class="p-4">
<h4 class="font-bold text-sm">{{ shoe.name }}</h4>
<p class="text-green-600 font-bold text-lg mt-1">{{ shoe.price }}</p>
<a href="https://wa.me/2348100000000?text=Hi%20Boyii,%20I%20want%20{{ shoe.name }}%20{{ shoe.price }}" class="block bg-black text-white text-center mt-3 py-2 rounded-full text-sm">Order on WhatsApp</a>
</div>
</div>
{% endfor %}
</div>
</div>

<footer class="bg-black text-white text-center p-8 mt-10">
<p class="font-bold">BOYII SHOE STORE - Abuja</p>
<p class="text-sm mt-2">📍 Abuja, FCT | Delivery in 24hrs</p>
</footer>
</body>
</html>
